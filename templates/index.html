<!DOCTYPE html>
<html>

<head>
    <title>RAG Chat</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        #chat {
            width: 700px;
            height: 400px;
            border: 4px solid gray;
            overflow: auto;
            padding: 10px;
            margin-bottom: 30px;
        }

        .user {
            color: blue;
            margin: 5px;
        }

        .bot {
            color: green;
            margin: 5px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Upload PDF</h2>

<input type="file" id="pdf">
<button onclick="upload()">Upload</button>

<hr>

<h2>Chat</h2>

<div id="chat"></div>

<input type="text" id="q" size="60" placeholder="Ask something...">
<button onclick="ask()">Send</button>

<script>

async function upload() {

    let fileInput = document.getElementById("pdf");

    if (!fileInput.files.length) {
        alert("Please select a PDF first");
        return;
    }

    let data = new FormData();
    data.append("file", fileInput.files[0]);

    try {
        let res = await fetch("/upload", {
            method: "POST",
            body: data
        });

        if (res.ok)
            alert("PDF Uploaded!");
        else
            alert("Upload failed");
        }

    catch (error) {
        alert("Server not running!");
    }
}


async function ask() {

    let qbox = document.getElementById("q");
    let q = qbox.value.trim();

    if (!q) return;

    let chat = document.getElementById("chat");

    // show user message
    chat.innerHTML += `<div class="user"><b>You:</b> ${q}</div>`;

    let data = new FormData();
    data.append("question", q);

    try {

        let r = await fetch("/ask", {
            method: "POST",
            body: data
        });

        let j = await r.json();

        // show bot message
        chat.innerHTML += `<div class="bot"><b>Bot:</b> ${j.answer}</div>`;

    } catch (e) {

        chat.innerHTML += `<div class="bot"><b>Bot:</b> Server error</div>`;
    }

    chat.scrollTop = chat.scrollHeight;
    qbox.value = "";
}


// ENTER KEY SUPPORT 
document.getElementById("q").addEventListener("keypress", function (event) {

    if (event.key === "Enter") {
        ask();
    }

});

</script>

</body>
</html>
